<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Shield Base -->
  <path d="M32 4 L8 14 V30 C8 44.5 18.2 55.8 32 60 C45.8 55.8 56 44.5 56 30 V14 L32 4 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />
  <!-- AI Neural Circuit Inside Shield -->
  <path d="M32 18 V28 M22 34 L28 30 M42 34 L36 30 M32 36 V46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="18" r="3" fill="#10b981" filter="url(#glow)" />
  <circle cx="20" cy="35" r="3" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="44" cy="35" r="3" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="32" cy="32" r="4.5" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="32" cy="48" r="3" fill="#10b981" filter="url(#glow)" />
</svg>
